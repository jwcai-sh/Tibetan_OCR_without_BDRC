<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>TB 段落翻译对照 · Gemini / GPT / 教师校正稿 / Yigdzin1</title>
  <script>if (new URLSearchParams(location.search).get('embedded') === '1') document.documentElement.classList.add('tb-embedded');</script>
  <link rel="stylesheet" href="./tb-translation.css?v=20261101-tb-integrated">
  <script src="./tb-translation-core.js?v=20261101-tb-source-link" defer></script>
  <script src="./tb-translation.js?v=20261101-tb-source-link" defer></script>
</head>
<body>
  <header class="topbar">
    <div><a id="backLink" href="./">← 返回工作台</a><h1>TB 段落翻译对照</h1><p>一段一号 · Gemini 与 GPT 译文 · 教师和 Yigdzin1 参考稿 · 人工定稿</p></div>
    <label class="file-button">导入编号 TXT<input id="fileInput" type="file" accept=".txt,text/plain"></label>
  </header>
  <main>
    <section class="settings" aria-label="翻译设置">
      <label>翻译接口<input id="endpointInput" type="url" value="http://127.0.0.1:8890/api/aggregate/chat" spellcheck="false"></label>
      <button id="healthButton" type="button">检查翻译接口</button>
    </section>
    <p id="status" role="status" aria-live="polite">请选择含 [TB-0001] 编号的 TXT 文件。原文留在本机，译文按文件内容保存到此浏览器。</p>
    <section id="workspace" class="workspace" hidden>
      <aside class="segment-nav" aria-label="段落导航">
        <div class="nav-head"><h2 id="documentTitle"></h2><p id="documentSummary"></p></div>
        <div class="page-controls">
          <button id="previousPageButton" type="button">上一页</button>
          <label>第 <input id="pageInput" type="number" min="1" value="1"> 页</label>
          <span id="pageTotal"></span>
          <button id="nextPageButton" type="button">下一页</button>
        </div>
        <div id="segmentList" class="segment-list"></div>
      </aside>
      <section class="editor" aria-label="当前段落">
        <div class="editor-head"><div><span class="eyebrow">当前翻译单位</span><h2 id="segmentTitle"></h2></div><span id="segmentProgress"></span></div>
        <div class="source-card"><h3>藏文原文</h3><p id="sourceText" lang="bo"></p></div>
        <div class="actions">
          <button id="pilotButton" type="button">从当前段双模型试译 20 段</button>
          <button id="stopButton" type="button" disabled>停止</button>
          <button id="exportButton" type="button">导出全部对照</button>
        </div>
        <div class="comparison-cards">
          <details class="model-card" open><summary>Gemini 翻译</summary><div class="card-actions"><label>翻译模型 <select id="modelAInput" aria-label="Gemini 翻译模型"><option value="gemini:gemini-4-argon">Gemini 4 Argon</option><option value="gemini:gemini-3.8-flash">Gemini 3.8 Flash</option><option value="gemini:gemini-3.6-flash">Gemini 3.6 Flash</option><option value="gemini:gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite（历史译文）</option><option value="gemini:gemini-3.1-flash-lite">Gemini 3.1 Flash-Lite</option><option value="gemini:gemini-2.0-flash">Gemini 2.0 Flash</option><option value="gemini:gemini-flash-latest">Gemini Flash Latest</option></select></label><button id="translateAButton" type="button">翻译当前段</button><button id="useAButton" type="button">填入人工定稿</button></div><p id="modelATitle" class="model-caption">Gemini 4 Argon</p><textarea id="modelAText" readonly aria-label="Gemini 译文" placeholder="尚未翻译"></textarea></details>
          <details class="model-card" open><summary>GPT 翻译</summary><div class="card-actions"><label>翻译模型 <select id="modelBInput" aria-label="GPT 翻译模型"><option value="yunwu:gpt-5.5">GPT 5.5（云雾）</option><option value="custom">自定义兼容模型…</option></select><input id="customModelBInput" hidden aria-label="自定义 GPT 模型 ID" placeholder="提供者:模型 ID" spellcheck="false"></label><button id="translateBButton" type="button">翻译当前段</button><button id="useBButton" type="button">填入人工定稿</button></div><p id="modelBTitle" class="model-caption">GPT 5.5（云雾）</p><textarea id="modelBText" readonly aria-label="GPT 译文" placeholder="尚未翻译"></textarea></details>
          <details class="model-card" open><summary>教师校正稿</summary><div class="card-actions"><label class="reference-import">导入按 TB 编号的教师校正稿 TXT <input id="teacherImport" type="file" accept=".txt,text/plain"></label></div><p id="teacherMeta" class="model-caption">尚未导入</p><textarea id="teacherText" readonly aria-label="教师校正稿" placeholder="当前段暂无教师校正稿"></textarea><button id="useTeacherButton" type="button">填入人工定稿</button></details>
          <details class="model-card" open><summary>Yigdzin1</summary><div class="card-actions"><label class="reference-import">导入按 TB 编号的 Yigdzin1 TXT <input id="yigdzin1Import" type="file" accept=".txt,text/plain"></label></div><p id="yigdzin1Meta" class="model-caption">尚未导入</p><textarea id="yigdzin1Text" readonly aria-label="Yigdzin1 参考稿" placeholder="当前段暂无 Yigdzin1 参考稿"></textarea><button id="useYigdzin1Button" type="button">填入人工定稿</button></details>
        </div>
        <label class="final-editor"><strong>人工定稿</strong><textarea id="finalText" placeholder="比较模型译文后，在这里编辑最终译文"></textarea></label>
        <div class="save-row"><button id="saveFinalButton" type="button">保存定稿</button><span id="saveState">未修改</span></div>
      </section>
    </section>
  </main>
</body>
</html>

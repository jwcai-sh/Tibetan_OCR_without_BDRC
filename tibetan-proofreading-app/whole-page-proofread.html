<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>整页藏文校对 · Gemini / 教师校正稿 / Yigdzin1</title>
  <style>
    :root { color: #1e2d3a; background: #f3f6f9; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 8px 24px; background: white; border-bottom: 1px solid #d8e1ea; }
    .brand { display: flex; align-items: center; gap: 14px; min-width: 0; color: #17211d; font-weight: 700; font-size: 18px; }
    .brand-mark { display: grid; place-items: center; width: 40px; height: 40px; flex: none; border-radius: 8px; color: white; background: linear-gradient(135deg, #23734d, #e27d2f); }
    .header-actions { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 9px; }
    .header-actions a { display: inline-flex; align-items: center; min-height: 34px; padding: 6px 10px; border: 1px solid #d6e0dc; border-radius: 7px; color: #17211d; text-decoration: none; white-space: nowrap; }
    .header-actions a:hover { background: #eef5f2; }
    #collaborationActor { white-space: nowrap; }
    .page-heading { padding: 13px 24px 5px; }
    h1 { margin: 0 0 5px; font-size: 22px; }
    .page-heading p { margin: 0; color: #526474; }
    a { color: #28649a; }
    .toolbar { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 24px; background: white; border-bottom: 1px solid #d8e1ea; }
    button { border: 1px solid #a7b9ca; border-radius: 7px; background: white; color: #254660; padding: 7px 12px; font: inherit; cursor: pointer; }
    button:disabled { opacity: .45; cursor: default; }
    #pageInput { width: 60px; padding: 7px; border: 1px solid #a7b9ca; border-radius: 7px; font: inherit; text-align: center; }
    #pageIndex { display: flex; flex-wrap: wrap; gap: 5px; padding: 12px 24px 2px; }
    #pageIndex button { min-width: 33px; padding: 4px 7px; border-radius: 18px; font-size: 13px; }
    #pageIndex button.active { background: #28649a; border-color: #28649a; color: white; }
    #feedback { margin: 0; padding: 9px 24px; color: #995b1b; background: #fff5e4; min-height: 38px; }
    #feedback.error { color: #9a2926; background: #fff0ec; }
    main { display: flex; flex-direction: column; gap: 12px; padding: 0 24px 24px; }
    section, .model-panel { min-width: 0; padding: 12px; background: white; border: 1px solid #d8e1ea; border-radius: 9px; }
    h2 { margin: 0; font-size: 17px; }
    .heading { display: flex; align-items: center; gap: 12px; margin-bottom: 9px; }
    .heading button:first-of-type { margin-left: auto; }
    .preview-tools { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 8px; margin-left: auto; }
    .heading .preview-tools button { margin-left: 0; }
    .rotation-button { display: inline-flex; align-items: center; gap: 5px; min-height: 35px; font-size: 13px; white-space: nowrap; }
    .rotation-button:hover { background: #edf5fb; }
    .rotation-button svg { width: 19px; height: 19px; flex: none; }
    #previewRotationStatus { color: #526474; font-size: 12px; white-space: nowrap; }
    .model-panel summary { display: inline-flex; align-items: center; gap: 10px; list-style: none; cursor: pointer; font-size: 17px; font-weight: 700; vertical-align: middle; }
    .model-panel summary::-webkit-details-marker { display: none; }
    .model-panel summary::before { content: ''; width: 8px; height: 8px; flex: none; border-right: 2px solid #45627c; border-bottom: 2px solid #45627c; transform: rotate(-45deg); transition: transform .15s ease; }
    .model-panel[open] summary::before { transform: rotate(45deg); }
    .model-panel summary:focus-visible { outline: 2px solid #28649a; outline-offset: 4px; border-radius: 3px; }
    .model-panel .model-text { margin-top: 9px; }
    .model-actions { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 0 0 12px; vertical-align: middle; }
    .model-actions select { padding: 7px; border: 1px solid #a7b9ca; border-radius: 7px; background: white; font: inherit; }
    .model-import { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin: 9px 0 0; font: 13px system-ui, sans-serif; color: #526474; }
    .model-import input { max-width: 250px; }
    #geminiRecognitionFeedback { margin: 8px 0 0; color: #9a2926; font-size: 13px; }
    #geminiRecognitionFeedback:empty { display: none; }
    .image-viewport { max-height: 58vh; overflow: auto; text-align: center; }
    #pageScan { display: block; width: 100%; height: auto; margin: auto; }
    .model-text, #correctedText { white-space: pre-wrap; overflow-wrap: anywhere; text-align: left; font-family: "Noto Serif Tibetan", "Kailasa", serif; font-size: 23px; line-height: 1.65; }
    .model-text { min-height: 55px; }
    .model-text.missing { color: #9a5250; font-family: system-ui, sans-serif; font-size: 15px; }
    mark.different { background: #fff08a; color: inherit; border-radius: 2px; }
    .omission { display: inline-block; width: 3px; height: 1.05em; margin: 0 2px; background: #ea7a2b; vertical-align: -.15em; border-radius: 2px; }
    #gemini4Panel { border-color: #9dc5e5; background: #f3f9ff; }
    #correctedText { display: block; width: 100%; min-height: 240px; padding: 9px; border: 1px solid #a7b9ca; border-radius: 6px; resize: vertical; }
    #saveCorrected { background: #28649a; border-color: #28649a; color: white; }
    .hint { margin: 0 0 9px; color: #526474; font-size: 13px; }
    .import-controls { margin-left: auto; font-size: 13px; }
    .import-controls summary { cursor: pointer; font-weight: 600; }
    .import-fields { position: absolute; right: 24px; z-index: 3; display: grid; gap: 8px; min-width: 300px; padding: 12px; background: white; border: 1px solid #a7b9ca; border-radius: 7px; box-shadow: 0 4px 14px #18334b25; }
    .import-fields label { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .import-fields input { max-width: 190px; }
    .import-fields small { color: #526474; }
    @media (max-width: 700px) { header { flex-wrap: wrap; } .header-actions { justify-content: flex-start; } .import-fields { right: 12px; left: 12px; min-width: 0; } }
    @media (max-width: 700px) { header, .toolbar, #pageIndex, main, .page-heading { padding-left: 12px; padding-right: 12px; } #feedback { padding-left: 12px; padding-right: 12px; } .image-viewport { max-height: 48vh; } .model-text, #correctedText { font-size: 20px; } }
  </style>
</head>
<body>
  <header><div class="brand"><span class="brand-mark" aria-hidden="true">藏</span><span>藏文典籍翻译工作台</span></div><nav class="header-actions" aria-label="项目操作"><span id="collaborationActor">协作者：读取中…</span><a id="collaborationLogout" href="/tibetan-proofreading-app/" hidden>退出</a><a href="/tibetan-proofreading-app/">主页</a><a id="backToWorkbench" href="/tibetan-proofreading-app/">返回逐行工作台 →</a></nav></header>
  <div id="feedback" role="status" aria-live="polite">正在读取云端结果…</div>
  <div class="page-heading"><h1>整页藏文校对</h1><p><strong id="bookName">正在读取书籍…</strong> · 原图在上，三个候选在下；以 Gemini 识别结果为差异基准。</p></div>
  <div class="toolbar">
    <button id="previous" type="button">上一页</button>
    <input id="pageInput" type="number" min="1" aria-label="当前页码" />
    <strong id="pageNumber">— / —</strong>
    <button id="next" type="button">下一页</button>
    <details id="topImportControls" class="import-controls" hidden><summary>导入文件</summary><div class="import-fields">
      <label>新建 PDF 项目 <input id="sourceImport" type="file" accept=".pdf,application/pdf" /></label>
      <label hidden>Gemini 4 TXT <input id="gemini4Import" type="file" accept=".txt,text/plain" /></label>
      </div>
    </details>
  </div>
  <nav id="pageIndex" aria-label="选择 PDF 页码"></nav>
  <main>
    <section>
      <div class="heading"><h2>原图</h2><div class="preview-tools">
        <span id="previewRotationStatus" aria-live="polite"></span>
        <button id="rotatePage" class="rotation-button" type="button" aria-label="本页顺时针旋转 90 度" title="点击一次，本页顺时针旋转 90°；连续点击可旋转 180°、270°并复位"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h13v11H4zM15 3a5 5 0 0 1 5 5v3m0-3-2-2m2 2 2-2"/></svg>本页</button>
        <button id="rotateDocument" class="rotation-button" type="button" aria-label="整本顺时针旋转 90 度" title="点击一次，整本顺时针旋转 90°；连续点击可旋转 180°、270°并复位，仅在本浏览器保存"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h13v11H4zM15 3a5 5 0 0 1 5 5v3m0-3-2-2m2 2 2-2"/></svg>整本</button>
        <button id="zoomOut" type="button" aria-label="缩小原图">−</button><button id="zoomIn" type="button" aria-label="放大原图">＋</button>
      </div></div>
      <div class="image-viewport"><img id="pageScan" alt="原始 PDF 页面" /></div>
    </section>
    <details id="gemini4Panel" class="model-panel" open><summary><span id="geminiModelLabel">Gemini 4 · 差异基准</span></summary><div class="model-actions"><select id="geminiRecognitionModel" aria-label="Gemini 识别模型"><option value="gemini-4-argon">Gemini 4 Argon</option><option value="gemini-3.8-flash">Gemini 3.8 Flash</option><option value="gemini-3.1-flash-lite">Gemini 3.1 Flash-Lite</option><option value="gemini-2.5-flash">Gemini 2.5 Flash</option></select><button id="recognizeGemini" type="button" disabled>识别当前页</button><button id="recognizeAllPages" type="button" disabled>识别所有页</button><button id="recognizeRemainingPages" type="button" disabled>识别剩余页</button><button id="stopBatchRecognition" type="button" title="当前页完成后停止" hidden>停止批量</button><button id="copyGemini" type="button">填入正确版</button></div><p id="geminiRecognitionFeedback" role="alert"></p><div id="gemini4Text" class="model-text"></div></details>
    <details class="model-panel" open><summary>教师校正稿</summary><label class="model-import">导入教师校正稿 TXT（按页分隔）<input id="teacherImport" type="file" accept=".txt,text/plain" /></label><div id="teacherText" class="model-text"></div></details>
    <details class="model-panel" open><summary>Yigdzin1</summary><label class="model-import">导入 Yigdzin1 TXT（按页分隔）<input id="yigdzin1Import" type="file" accept=".txt,text/plain" /></label><div id="yigdzin1Text" class="model-text"></div></details>
    <section><div class="heading"><h2>人工校对正确版</h2><button id="saveCorrected" type="button">保存正确版</button></div><p class="hint">黄色表示候选比 Gemini 多识或写法不同；橙色短线表示候选漏识。空格与换行不参与差异计算。正确版独立保存到云端。</p><textarea id="correctedText" aria-label="当前页人工校对正确版"></textarea></section>
  </main>
  <script src="./whole-page-proofread.js?v=20261031-v13" defer></script>
</body>
</html>
